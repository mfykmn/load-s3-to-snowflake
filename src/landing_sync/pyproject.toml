[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "landing-sync"
version = "0.1.0"
description = "RAW テーブル（VARIANT）から Landing テーブルへのスキーマ同期・データ同期ライブラリ"
requires-python = ">=3.9"
dependencies = [
    "snowflake-connector-python>=3.6.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["landing_sync"]

[tool.ruff]
line-length = 100
target-version = "py39"
